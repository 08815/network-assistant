<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网工智能助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>网工智能助手</h1>
  </div>

  <div class="container">
    <div class="feature-card" onclick="location.href='notes-list.html'">
      <div class="feature-icon">📝</div>
      <div class="feature-info">
        <h3>我的笔记</h3>
        <p>管理你的学习笔记</p>
        <div class="feature-stat" id="notes-count">加载中...</div>
      </div>
    </div>

    <div class="feature-card" onclick="location.href='faults-list.html'">
      <div class="feature-icon">🔧</div>
      <div class="feature-info">
        <h3>故障手册</h3>
        <p>15个常见网络故障排查</p>
        <div class="feature-stat" id="faults-count">加载中...</div>
      </div>
    </div>

    <div class="feature-card" onclick="location.href='commands-list.html'">
      <div class="feature-icon">💻</div>
      <div class="feature-info">
        <h3>命令速查</h3>
        <p>20条常用网络命令参考</p>
        <div class="feature-stat" id="commands-count">加载中...</div>
      </div>
    </div>

    <div class="feature-card" onclick="location.href='ai-chat.html'">
      <div class="feature-icon">🤖</div>
      <div class="feature-info">
        <h3>AI智能问答</h3>
        <p>基于你的笔记智能答疑</p>
        <div class="feature-stat">开始问答 →</div>
      </div>
    </div>

    <div class="recent-section" id="recent-section">
      <h3>最近浏览</h3>
      <div id="recent-list"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="location.href='index.html'">
      <span class="icon">🏠</span>
      <span class="label">首页</span>
    </div>
    <div class="nav-item" onclick="location.href='notes-list.html'">
      <span class="icon">📝</span>
      <span class="label">笔记</span>
    </div>
    <div class="nav-item" onclick="location.href='faults-list.html'">
      <span class="icon">🔧</span>
      <span class="label">故障</span>
    </div>
    <div class="nav-item" onclick="location.href='commands-list.html'">
      <span class="icon">💻</span>
      <span class="label">命令</span>
    </div>
    <div class="nav-item" onclick="location.href='ai-chat.html'">
      <span class="icon">🤖</span>
      <span class="label">AI</span>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="js/data-notes.js"></script>
  <script src="js/data-faults.js"></script>
  <script src="js/data-commands.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 初始化首页数据
    function initIndex() {
      // 更新统计数据
      const notes = JSON.parse(localStorage.getItem('notes') || JSON.stringify(notesData));
      const faults = faultsData;
      const commands = commandsData;

      document.getElementById('notes-count').textContent = `${notes.length}条笔记`;
      document.getElementById('faults-count').textContent = `${faults.length}个故障`;
      document.getElementById('commands-count').textContent = `${commands.length}条命令`;

      // 加载最近浏览
      loadRecentViewed();
    }

    function loadRecentViewed() {
      const recent = JSON.parse(localStorage.getItem('recentViewed') || '[]');
      const container = document.getElementById('recent-list');

      if (recent.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>暂无最近浏览记录</p></div>';
        return;
      }

      let html = '';
      recent.slice(0, 3).forEach(item => {
        let title = '';
        let icon = '';
        let link = '';

        if (item.type === 'note') {
          const note = notesData.find(n => n.id === item.id);
          if (note) {
            title = note.title;
            icon = '📝';
            link = `note-edit.html?id=${item.id}`;
          }
        } else if (item.type === 'fault') {
          const fault = faultsData.find(f => f.id === item.id);
          if (fault) {
            title = fault.title;
            icon = '🔧';
            link = `fault-detail.html?id=${item.id}`;
          }
        } else if (item.type === 'command') {
          const command = commandsData.find(c => c.id === item.id);
          if (command) {
            title = command.name;
            icon = '💻';
            link = `command-detail.html?id=${item.id}`;
          }
        }

        if (title) {
          html += `
            <div class="recent-item" onclick="location.href='${link}'">
              <span class="recent-icon">${icon}</span>
              <div class="recent-info">
                <h4>${title}</h4>
                <p>${item.time}</p>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html || '<div class="empty-state"><p>暂无最近浏览记录</p></div>';
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', initIndex);
  </script>
</body>
</html>
