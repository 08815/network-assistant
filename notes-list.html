<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的笔记 - 网工智能助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <button class="header-back" onclick="location.href='index.html'">←</button>
    <h1>我的笔记</h1>
  </div>

  <div class="container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索笔记标题、内容或标签...">
    </div>

    <div class="filter-tags" id="filter-tags">
      <div class="filter-tag active" data-tag="">全部</div>
    </div>

    <div id="notes-list"></div>
  </div>

  <button class="fab" onclick="location.href='note-edit.html'">+</button>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'">
      <span class="icon">🏠</span>
      <span class="label">首页</span>
    </div>
    <div class="nav-item active" onclick="location.href='notes-list.html'">
      <span class="icon">📝</span>
      <span class="label">笔记</span>
    </div>
    <div class="nav-item" onclick="location.href='faults-list.html'">
      <span class="icon">🔧</span>
      <span class="label">故障</span>
    </div>
    <div class="nav-item" onclick="location.href='commands-list.html'">
      <span class="icon">💻</span>
      <span class="label">命令</span>
    </div>
    <div class="nav-item" onclick="location.href='ai-chat.html'">
      <span class="icon">🤖</span>
      <span class="label">AI</span>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="js/data-notes.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allNotes = [];
    let activeTag = '';

    function initNotesList() {
      allNotes = JSON.parse(localStorage.getItem('notes') || JSON.stringify(notesData));
      renderFilterTags();
      renderNotes();

      document.getElementById('search-input').addEventListener('input', renderNotes);
    }

    function renderFilterTags() {
      const tags = new Set();
      allNotes.forEach(note => {
        note.tags.forEach(tag => tags.add(tag));
      });

      const container = document.getElementById('filter-tags');
      let html = '<div class="filter-tag active" data-tag="">全部</div>';
      tags.forEach(tag => {
        html += `<div class="filter-tag" data-tag="${tag}">${tag}</div>`;
      });
      container.innerHTML = html;

      container.querySelectorAll('.filter-tag').forEach(tag => {
        tag.addEventListener('click', function() {
          container.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          activeTag = this.dataset.tag;
          renderNotes();
        });
      });
    }

    function renderNotes() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      let filtered = allNotes.filter(note => {
        const matchSearch = !searchTerm || 
          note.title.toLowerCase().includes(searchTerm) ||
          note.content.toLowerCase().includes(searchTerm) ||
          note.tags.some(tag => tag.toLowerCase().includes(searchTerm));
        
        const matchTag = !activeTag || note.tags.includes(activeTag);
        
        return matchSearch && matchTag;
      });

      const container = document.getElementById('notes-list');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>暂无笔记</p></div>';
        return;
      }

      let html = '';
      filtered.forEach(note => {
        const summary = note.content.substring(0, 50) + (note.content.length > 50 ? '...' : '');
        const tagsHtml = note.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('');
        
        html += `
          <div class="card" onclick="location.href='note-edit.html?id=${note.id}'">
            <div class="card-title">${note.title}</div>
            <div class="card-desc">${summary}</div>
            <div style="margin-bottom: 8px;">${tagsHtml}</div>
            <div class="card-meta">
              <span>${note.category}</span>
              <span>更新于 ${note.updatedAt}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', initNotesList);
  </script>
</body>
</html>
