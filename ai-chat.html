<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI智能问答 - 网工智能助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <button class="header-back" onclick="location.href='index.html'">←</button>
    <h1>AI智能问答</h1>
  </div>

  <div class="chat-container" id="chat-container"></div>

  <div class="chat-input-area">
    <textarea id="chat-input" placeholder="输入网络相关问题..." rows="1"></textarea>
    <button class="btn btn-primary" id="send-btn">发送</button>
  </div>

  <div class="container" style="padding-bottom: 120px;">
    <div class="quick-questions">
      <button class="quick-btn" onclick="quickQuestion('电脑连不上网，怎么排查？')">电脑连不上网，怎么排查？</button>
      <button class="quick-btn" onclick="quickQuestion('如何配置华为交换机的VLAN？')">如何配置华为交换机的VLAN？</button>
      <button class="quick-btn" onclick="quickQuestion('OSPF协议配置步骤是什么？')">OSPF协议配置步骤是什么？</button>
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <button class="btn btn-text" onclick="clearHistory()">🗑️ 清除历史</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'">
      <span class="icon">🏠</span>
      <span class="label">首页</span>
    </div>
    <div class="nav-item" onclick="location.href='notes-list.html'">
      <span class="icon">📝</span>
      <span class="label">笔记</span>
    </div>
    <div class="nav-item" onclick="location.href='faults-list.html'">
      <span class="icon">🔧</span>
      <span class="label">故障</span>
    </div>
    <div class="nav-item" onclick="location.href='commands-list.html'">
      <span class="icon">💻</span>
      <span class="label">命令</span>
    </div>
    <div class="nav-item active" onclick="location.href='ai-chat.html'">
      <span class="icon">🤖</span>
      <span class="label">AI</span>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="js/data-notes.js"></script>
  <script src="js/data-faults.js"></script>
  <script src="js/data-commands.js"></script>
  <script src="js/app.js"></script>
  <script>
    let chatHistory = [];

    function initChat() {
      chatHistory = JSON.parse(localStorage.getItem('aiHistory') || '[]');
      renderChat();

      const params = new URLSearchParams(window.location.search);
      const question = params.get('question');
      if (question) {
        document.getElementById('chat-input').value = question;
        sendMessage();
      }

      document.getElementById('send-btn').addEventListener('click', sendMessage);
      document.getElementById('chat-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    function renderChat() {
      const container = document.getElementById('chat-container');
      if (chatHistory.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🤖</div><p>输入问题开始AI问答</p></div>';
        return;
      }

      let html = '';
      chatHistory.forEach(item => {
        html += `
          <div class="chat-message user">
            <div class="chat-bubble">${item.q}</div>
          </div>
          <div class="chat-message ai">
            <div class="chat-bubble">${item.a.replace(/\n/g, '<br>')}</div>
          </div>
        `;
      });

      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      chatHistory.unshift({ q: question, a: '', time: new Date().toLocaleString() });
      renderChat();

      const notes = JSON.parse(localStorage.getItem('notes') || JSON.stringify(notesData));
      const notesContext = notes.slice(0, 5).map(n => `《${n.title}》：${n.content.substring(0, 100)}`).join('\n');

      const prompt = `你是一名网络工程师，精通网络技术和设备配置。用户可以参考以下笔记内容：${notesContext}用户问题：${question}请按以下格式回复（如果适用）：1.功能说明（一句话）2.华为命令示例（含注释）3.思科命令示例（含注释，如果适用）4.注意事项（2-3点）5.推荐相关知识点`;

      const loadingIndex = chatHistory.findIndex(item => item.a === '');
      renderChat();

      try {
        const answer = await callOpenCodeAI(prompt);
        chatHistory[loadingIndex].a = answer;
        saveHistory();
        renderChat();
      } catch (error) {
        chatHistory[loadingIndex].a = `⚠️ AI服务暂时不可用：${error.message}`;
        renderChat();
      }
    }

    async function callOpenCodeAI(prompt) {
      const apiKey = localStorage.getItem('opencode_api_key');

      if (!apiKey) {
        await new Promise(resolve => setTimeout(resolve, 1500));
        return `这是一个很好的网络技术问题！\n\n根据您的问题"${prompt.substring(prompt.indexOf('用户问题：') + 5)}"，建议如下：\n\n1. 首先检查物理连接和网络配置\n2. 使用ping、tracert等命令诊断连通性\n3. 检查相关设备配置是否正确\n4. 查看设备日志确认是否有错误信息\n\n推荐查看相关笔记获取更详细的配置说明。`;
      }

      const response = await fetch('https://api.opencode.ai/v1/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'opencode-zen',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.3,
          max_tokens: 800
        })
      });

      if (!response.ok) throw new Error(`API错误：${response.status}`);
      const data = await response.json();
      return data.choices[0].message.content;
    }

    function quickQuestion(question) {
      document.getElementById('chat-input').value = question;
      sendMessage();
    }

    function clearHistory() {
      if (!confirm('确定要清除所有对话历史吗？')) return;
      chatHistory = [];
      localStorage.removeItem('aiHistory');
      renderChat();
      showToast('历史已清除');
    }

    function saveHistory() {
      if (chatHistory.length > 20) {
        chatHistory = chatHistory.slice(0, 20);
      }
      localStorage.setItem('aiHistory', JSON.stringify(chatHistory));
    }

    document.addEventListener('DOMContentLoaded', initChat);
  </script>
</body>
</html>
