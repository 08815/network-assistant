<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记编辑 - 网工智能助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <button class="header-back" onclick="location.href='notes-list.html'">←</button>
    <h1 id="page-title">新增笔记</h1>
  </div>

  <div class="container">
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="note-title" placeholder="输入笔记标题">
    </div>

    <div class="form-group">
      <label>内容</label>
      <textarea id="note-content" placeholder="输入笔记内容..."></textarea>
    </div>

    <div class="form-group">
      <label>标签</label>
      <div id="tags-container" style="margin-bottom: 8px;"></div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="tag-input" placeholder="输入标签后回车">
        <button class="btn btn-secondary" id="ai-tags-btn">AI推荐标签</button>
      </div>
    </div>

    <div class="form-group">
      <label>分类</label>
      <input type="text" id="note-category" placeholder="如：交换技术、路由技术">
    </div>

    <div style="display: flex; gap: 12px; margin-top: 20px;">
      <button class="btn btn-primary" id="save-btn">保存</button>
      <button class="btn btn-danger" id="delete-btn" style="display: none;">删除</button>
      <button class="btn btn-text" onclick="location.href='notes-list.html'">返回</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'">
      <span class="icon">🏠</span>
      <span class="label">首页</span>
    </div>
    <div class="nav-item active" onclick="location.href='notes-list.html'">
      <span class="icon">📝</span>
      <span class="label">笔记</span>
    </div>
    <div class="nav-item" onclick="location.href='faults-list.html'">
      <span class="icon">🔧</span>
      <span class="label">故障</span>
    </div>
    <div class="nav-item" onclick="location.href='commands-list.html'">
      <span class="icon">💻</span>
      <span class="label">命令</span>
    </div>
    <div class="nav-item" onclick="location.href='ai-chat.html'">
      <span class="icon">🤖</span>
      <span class="label">AI</span>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="js/data-notes.js"></script>
  <script src="js/app.js"></script>
  <script>
    let noteId = null;
    let currentTags = [];

    function initNoteEdit() {
      const params = new URLSearchParams(window.location.search);
      noteId = params.get('id');

      if (noteId) {
        document.getElementById('page-title').textContent = '编辑笔记';
        document.getElementById('delete-btn').style.display = 'inline-flex';
        loadNote(noteId);
      }

      document.getElementById('tag-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim()) {
          addTag(this.value.trim());
          this.value = '';
        }
      });

      document.getElementById('save-btn').addEventListener('click', saveNote);
      document.getElementById('delete-btn').addEventListener('click', deleteNote);
      document.getElementById('ai-tags-btn').addEventListener('click', aiRecommendTags);
    }

    function loadNote(id) {
      const notes = JSON.parse(localStorage.getItem('notes') || JSON.stringify(notesData));
      const note = notes.find(n => n.id == id);
      if (!note) {
        showToast('笔记不存在');
        return;
      }

      document.getElementById('note-title').value = note.title;
      document.getElementById('note-content').value = note.content;
      document.getElementById('note-category').value = note.category;
      currentTags = [...note.tags];
      renderTags();
    }

    function renderTags() {
      const container = document.getElementById('tags-container');
      container.innerHTML = currentTags.map((tag, index) => 
        `<span class="tag">${tag}<span class="tag-remove" onclick="removeTag(${index})">×</span></span>`
      ).join('');
    }

    function addTag(tag) {
      if (!currentTags.includes(tag)) {
        currentTags.push(tag);
        renderTags();
      }
    }

    function removeTag(index) {
      currentTags.splice(index, 1);
      renderTags();
    }

    function saveNote() {
      const title = document.getElementById('note-title').value.trim();
      const content = document.getElementById('note-content').value.trim();
      const category = document.getElementById('note-category').value.trim();

      if (!title || !content) {
        showToast('标题和内容不能为空');
        return;
      }

      let notes = JSON.parse(localStorage.getItem('notes') || JSON.stringify(notesData));
      const now = new Date().toISOString().split('T')[0];

      if (noteId) {
        const index = notes.findIndex(n => n.id == noteId);
        if (index !== -1) {
          notes[index] = { ...notes[index], title, content, category, tags: currentTags, updatedAt: now };
        }
      } else {
        const newId = notes.length > 0 ? Math.max(...notes.map(n => n.id)) + 1 : 1;
        notes.unshift({
          id: newId,
          title,
          content,
          category,
          tags: currentTags,
          createdAt: now,
          updatedAt: now
        });
      }

      localStorage.setItem('notes', JSON.stringify(notes));
      showToast('保存成功');
      setTimeout(() => location.href = 'notes-list.html', 500);
    }

    function deleteNote() {
      if (!confirm('确定要删除这条笔记吗？')) return;

      let notes = JSON.parse(localStorage.getItem('notes') || JSON.stringify(notesData));
      notes = notes.filter(n => n.id != noteId);
      localStorage.setItem('notes', JSON.stringify(notes));
      showToast('已删除');
      setTimeout(() => location.href = 'notes-list.html', 500);
    }

    async function aiRecommendTags() {
      const content = document.getElementById('note-content').value.trim();
      if (!content) {
        showToast('请先输入笔记内容');
        return;
      }

      showToast('AI正在分析...');
      
      const prompt = `你是一名网络技术专业导师。请分析以下学习笔记内容，推荐3-5个标签（每个标签2-6个字），标签应涵盖：技术点、设备类型、协议名称、应用场景等维度。笔记内容：${content}只返回标签列表，格式为：标签1,标签2,标签3`;
      
      try {
        const response = await callOpenCodeAI(prompt);
        const tags = response.split(/[,，、\s]+/).filter(t => t.length >= 2 && t.length <= 6);
        
        tags.forEach(tag => addTag(tag));
        showToast('标签推荐完成');
      } catch (error) {
        showToast('AI推荐失败：' + error.message);
      }
    }

    async function callOpenCodeAI(prompt) {
      const apiKey = localStorage.getItem('opencode_api_key');
      
      if (!apiKey) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        return 'VLAN,华为命令,二层交换,网络基础,交换机配置';
      }

      const response = await fetch('https://api.opencode.ai/v1/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'opencode-zen',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.3,
          max_tokens: 200
        })
      });

      if (!response.ok) throw new Error(`API错误：${response.status}`);
      const data = await response.json();
      return data.choices[0].message.content;
    }

    document.addEventListener('DOMContentLoaded', initNoteEdit);
  </script>
</body>
</html>
